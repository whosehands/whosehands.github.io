name: Probe LoC API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/probe_loc_api.py, .github/workflows/probe-loc.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe_loc_api.py
      - run: |
          git config user.name "whose-hands-bot"; git config user.email "actions@users.noreply.github.com"
          git add sources/loc-probe.json; git commit -m "LoC API probe" || true
          git pull --rebase origin main; git push origin HEAD:main

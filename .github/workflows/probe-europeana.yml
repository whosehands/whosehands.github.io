name: Probe Europeana audio hosts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/probe-europeana.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          echo "== phonobase page"; curl -sL -m 30 -A "$UA" https://www.phonobase.org/10207.html | grep -ioE '(src|href|data-[a-z]+)="[^"]*(mp3|ogg|audio|son)[^"]*"' | head -20
          curl -sL -m 30 -A "$UA" https://www.phonobase.org/10207.html | head -c 3000; echo
          echo "== phonobase /audio/"; curl -s -o /dev/null -w "%{http_code}\n" -m 30 -A "$UA" https://www.phonobase.org/audio/
          for u in https://www.doria.fi/bitstream/10024/66457/1/RAI-GramophoneGC-82955.mp3 "https://www.doria.fi/bitstream/handle/10024/66457/RAI-GramophoneGC-82955.mp3" https://www.doria.fi/handle/10024/66457 ; do
            echo "== $u"; curl -s -o /tmp/b -r 0-1023 -m 30 -A "$UA" -H "Origin: https://whosehands.github.io" -D - -w "code=%{http_code}\n" -L "$u" | grep -iE "^(HTTP|content-type|content-length|content-range|access-control|location|server|cf-)|code=" ; head -c 600 /tmp/b | tr -d '\0' ; echo
          done
          echo "== europeana proxy"; curl -s -o /dev/null -r 0-1023 -m 30 -D - -L "https://proxy.europeana.eu/2021001/_oai_www_doria_fi_10024_72339?view=https%3A%2F%2Fwww.doria.fi%2Fbitstream%2F10024%2F72339%2F1%2FRAI-GramophoneGC-2-82586-01-1-001.mp3" | grep -iE "^(HTTP|content-type|content-length|access-control|location)"

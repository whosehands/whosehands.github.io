name: Fetch recording sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/fetch_loc.py, .github/workflows/fetch-sources.yml]
  schedule:
    - cron: "17 9 28 * *"   # monthly, 28th, 09:17 UTC (before the 1st-of-month check)
permissions:
  contents: write
concurrency:
  group: fetch-sources
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source listings
        run: |
          mkdir -p sources
          python3 tools/fetch_loc.py
          ls -la sources
      - name: Commit
        run: |
          git config user.name "whose-hands-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sources
          git commit -m "Update source listings" || echo "nothing to commit"
          git pull --rebase origin main
          git push
